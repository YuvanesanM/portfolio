<div id="lock" class="lock">
  <div class="lock-card">
    <div class="lock-mark"><svg class="ico"><use href="#i-lock"/></svg></div>
    <h1>Portfolio</h1>
    <p class="muted">Sign in with an authorised Google account.</p>
    <div id="gsi" class="lock-gsi"><div class="spinner"></div></div>
    <p id="lockMsg" class="lock-msg" role="status"></p>
  </div>
</div>

<div id="loading" class="loading" hidden>
  <div class="spinner lg"></div>
  <p>Loading portfolio</p>
  <p id="loadingMsg" class="muted small" role="status">Connecting to data server…</p>
</div>

<div id="app" class="app" hidden>
  <header class="topbar">
    <a class="brand" href="#overview"><span class="brand-mark"><svg class="ico"><use href="#i-trend"/></svg></span><span>Portfolio</span></a>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <div class="topbar-actions">
      <span id="asOf" class="asof muted small"></span>
      <button class="btn btn-primary" data-action="update"><svg class="ico"><use href="#i-refresh"/></svg><span>Update</span></button>
      <button class="icon-btn" data-action="share" title="Share or export" aria-label="Share or export"><svg class="ico"><use href="#i-share"/></svg></button>
      <button class="icon-btn" data-action="theme" title="Toggle theme" aria-label="Toggle theme"><svg class="ico"><use href="#i-sun"/></svg></button>
      <button class="icon-btn" data-action="lock" title="Lock" aria-label="Lock"><svg class="ico"><use href="#i-lock"/></svg></button>
    </div>
  </header>
  <div id="offline" class="banner" hidden>
    <svg class="ico"><use href="#i-alert"/></svg>
    <span>Data server unreachable — showing values from code only. Saving is disabled.</span>
    <button class="btn btn-ghost small" data-action="reload">Retry</button>
  </div>
  <main id="view" class="main"></main>
  <nav class="bottom-nav" id="bottomNav" aria-label="Sections"></nav>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
