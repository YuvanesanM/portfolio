<div id="lock" class="lock">
  <div class="lock-card">
    <div class="lock-mark">Y</div>
    <h1>Yuvan's Portfolio</h1>
    <p class="muted">Sign in with an authorised Google account.</p>
    <div id="gsi" class="lock-gsi"><div class="spinner"></div></div>
    <p id="lockMsg" class="lock-msg" role="status"></p>
  </div>
</div>

<div id="loading" class="loading" hidden>
  <div class="spinner lg"></div>
  <p>Loading portfolio</p>
  <p id="loadingMsg" class="muted small" role="status">Connecting to data server…</p>
</div>

<div id="app" class="app" hidden>
  <aside class="sidebar" id="sidebar" aria-label="Primary">
    <a class="brand" href="#overview"><span class="brand-mark">Y</span><span class="brand-text"><b>YUVAN'S PORTFOLIO</b><span>Wealth dashboard</span></span></a>
    <nav id="nav" aria-label="Sections"></nav>
    <div class="sidebar-foot">
      <div class="user-chip"><span class="avatar" id="avatar">Y</span><span class="meta"><b id="userName">Yuvan</b><span id="userRole">Authorised account</span></span></div>
      <button class="btn btn-ghost btn-collapse" data-action="collapse" title="Collapse sidebar"><svg class="ico"><use href="#i-panel"/></svg><span>Collapse</span></button>
    </div>
  </aside>
  <div class="drawer-backdrop" id="drawerBackdrop" data-action="closeDrawer" hidden></div>

  <div class="content">
    <header class="topbar">
      <button class="icon-btn menu-btn" data-action="openDrawer" aria-label="Open navigation"><svg class="ico"><use href="#i-menu"/></svg></button>
      <div class="topbar-title"><span class="greet" id="greet"></span><h1 id="pageTitle">Overview</h1></div>
      <div class="topbar-actions">
        <span id="asOf" class="asof"><svg class="ico"><use href="#i-calendar"/></svg><span></span></span>
        <button class="btn btn-primary" data-action="update"><svg class="ico"><use href="#i-refresh"/></svg><span>Update values</span></button>
        <button class="icon-btn" data-action="mask" title="Hide values" aria-label="Hide values" aria-pressed="false"><svg class="ico"><use href="#i-eye"/></svg></button>
        <button class="icon-btn" data-action="share" title="Share or export" aria-label="Share or export"><svg class="ico"><use href="#i-share"/></svg></button>
        <button class="icon-btn" data-action="theme" title="Toggle theme" aria-label="Toggle theme"><svg class="ico"><use href="#i-sun"/></svg></button>
        <button class="icon-btn" data-action="lock" title="Lock" aria-label="Lock"><svg class="ico"><use href="#i-lock"/></svg></button>
      </div>
    </header>
    <div id="offline" class="banner" hidden>
      <svg class="ico"><use href="#i-alert"/></svg>
      <span>Data server unreachable — showing values from code only. Saving is disabled.</span>
      <button class="btn btn-ghost small" data-action="reload">Retry</button>
    </div>
    <main id="view" class="main"></main>
  </div>
  <nav class="bottom-nav" id="bottomNav" aria-label="Sections"></nav>
</div>

<div id="modalRoot"></div>
<div id="toast" class="toast" role="status" hidden></div>
